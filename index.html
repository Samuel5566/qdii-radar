<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QDII Radar</title>
<style>
:root{--bg:#080a0e;--panel:#11161d;--panel2:#0f141b;--line:#27303d;--text:#f6f7fb;--muted:#94a0af;--green:#52d489;--yellow:#efc15c;--red:#ff7474;--blue:#7da5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px 20px 56px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}h1{margin:0;font-size:30px}.blue{color:var(--blue)}.sub{color:var(--muted);font-size:13px;margin-top:7px}.updateBox{text-align:right}.time{font-size:12px;color:var(--muted);margin-bottom:8px}button,select,input{background:#10151d;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px}button{cursor:pointer}.primary{background:#1c2942;border-color:#3a5b99}.primary:disabled{opacity:.55}.notice{margin:18px 0;background:#10151c;border:1px solid #2a3444;border-radius:14px;padding:13px 16px;font-size:13px;line-height:1.7;color:#c4ccd7}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.lab{font-size:12px;color:var(--muted)}.big{font-size:25px;font-weight:800;margin-top:7px}.g{color:var(--green)}.y{color:var(--yellow)}.r{color:var(--red)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}input{min-width:260px}.tablebox{border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;background:var(--panel);min-width:1180px}th,td{padding:12px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:left;white-space:nowrap}th{background:#0e131a;color:var(--muted);position:sticky;top:0}.name{font-weight:700}.code{color:var(--muted);font-size:11px;margin-top:3px}.tag{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;display:inline-block}.limit{color:var(--yellow)}.stop{color:var(--red)}.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}.same{color:var(--muted)}.quota{font-weight:750}.best{color:var(--green);font-weight:700}.foot{margin-top:15px;color:var(--muted);font-size:11px;line-height:1.7}.toast{position:fixed;right:24px;top:24px;z-index:99;background:#151c26;border:1px solid #34445a;border-radius:12px;padding:13px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-size:13px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:900px){header{display:block}.updateBox{text-align:left;margin-top:12px}.cards{grid-template-columns:1fr 1fr}.toast{left:20px;right:20px}}
</style>
</head>
<body><div id="toast" class="toast"></div><div class="wrap">
<header><div><h1>QDII Radar <span class="blue">LIVE</span></h1><div class="sub">纳斯达克100 + 标普500｜场外额度｜直销/代销｜自动更新</div></div><div class="updateBox"><div class="time">数据更新时间：<span id="updated">读取中…</span></div><button id="refresh" class="primary">↻ 立即刷新</button></div></header>
<div id="notice" class="notice">GitHub Actions 每小时自动抓取一次。这里的“立即刷新”会立刻读取仓库中最新的 current.json；真正的数据抓取由后台 Actions 完成。</div>
<div class="cards"><div class="card"><div class="lab">总份额</div><div class="big" id="total">—</div></div><div class="card"><div class="lab">纳斯达克100</div><div class="big blue" id="nas">—</div></div><div class="card"><div class="lab">标普500</div><div class="big" id="sp">—</div></div><div class="card"><div class="lab">场外可买</div><div class="big g" id="buyable">—</div></div><div class="card"><div class="lab">本次额度变动</div><div class="big y" id="changed">—</div></div></div>
<div class="toolbar"><select id="idx"><option>全部指数</option><option>纳斯达克100</option><option>标普500</option></select><select id="type"><option>只看场外</option><option>全部（含场内ETF）</option></select><select id="status"><option>全部状态</option><option>限购</option><option>开放</option><option>暂停</option><option>场内</option></select><select id="sort"><option value="max">最高额度</option><option value="agency">代销额度</option><option value="direct">直销额度</option><option value="code">基金代码</option></select><input id="q" placeholder="搜索基金名 / 代码"></div>
<div class="tablebox"><table><thead><tr><th>#</th><th>基金</th><th>指数</th><th>份额</th><th>状态</th><th>代销额度</th><th>直销额度</th><th>今天优先渠道</th><th>较上次</th><th>渠道说明</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="foot">数据源：QDII 基金申购限额公开日报。最终申购状态与额度以基金管理人公告和实际下单页面为准。额度高只代表今天更容易买到，不等于基金投资质量更高。</div>
</div>
<script>
let funds=[];const $=id=>document.getElementById(id);const money=n=>!n?'—':n>=10000?(n/10000)+'万元':n+'元';const changeText=c=>c==='up'?'↑ 放宽':c==='down'?'↓ 收紧':c==='status'?'● 状态变化':c==='new'?'NEW':'—';const changeClass=c=>c==='up'?'up':(c==='down'||c==='status')?'down':'same';
function best(f){if(f.type!=='场外')return '证券账户';if(f.status==='暂停')return '暂不可买';if(f.direct>f.agency)return '基金公司直销';if(f.agency>0)return '支付宝/天天等代销';if(f.direct>0)return '基金公司直销';return '—'}
function render(){let a=[...funds],iv=$('idx').value,tv=$('type').value,sv=$('status').value,q=$('q').value.toLowerCase(),s=$('sort').value;if(iv!=='全部指数')a=a.filter(f=>f.index===iv);if(tv==='只看场外')a=a.filter(f=>f.type==='场外');if(sv!=='全部状态')a=a.filter(f=>f.status===sv);if(q)a=a.filter(f=>(f.name+f.code).toLowerCase().includes(q));if(s==='max')a.sort((x,y)=>Math.max(y.agency,y.direct)-Math.max(x.agency,x.direct));if(s==='agency')a.sort((x,y)=>y.agency-x.agency);if(s==='direct')a.sort((x,y)=>y.direct-x.direct);if(s==='code')a.sort((x,y)=>x.code.localeCompare(y.code));$('rows').innerHTML=a.map((f,i)=>`<tr><td>${i+1}</td><td><div class="name">${f.name}</div><div class="code">${f.code}</div></td><td>${f.index}</td><td>${f.share||'—'}</td><td><span class="tag ${f.status==='限购'?'limit':f.status==='暂停'?'stop':''}">${f.status}</span></td><td class="quota">${money(f.agency)}</td><td class="quota">${money(f.direct)}</td><td class="best">${best(f)}</td><td class="${changeClass(f.change)}">${changeText(f.change)}</td><td>${f.channel_note||'—'}</td></tr>`).join('')}
function toast(msg){$('toast').textContent=msg;$('toast').className='toast show';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').className='toast',2500)}
async function load(manual=false){$('refresh').disabled=true;$('refresh').textContent=manual?'读取中…':'加载中…';try{const r=await fetch('data/current.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();funds=d.funds||[];$('updated').textContent=d.updated_at?new Date(d.updated_at).toLocaleString():'等待首次后台更新';$('total').textContent=d.summary?.total??funds.length;$('nas').textContent=d.summary?.nasdaq100??funds.filter(f=>f.index==='纳斯达克100').length;$('sp').textContent=d.summary?.sp500??funds.filter(f=>f.index==='标普500').length;$('buyable').textContent=d.summary?.otc_buyable??funds.filter(f=>f.type==='场外'&&['限购','开放'].includes(f.status)).length;$('changed').textContent=d.summary?.changes??0;render();if(manual)toast(funds.length?`已读取最新仓库数据｜${funds.length}只`:'后台尚未完成首次抓取')}catch(e){$('notice').textContent='读取数据失败：'+e.message;if(manual)toast('刷新失败：'+e.message)}$('refresh').disabled=false;$('refresh').textContent='↻ 立即刷新'}
['idx','type','status','sort','q'].forEach(id=>$(id).addEventListener('input',render));$('refresh').onclick=()=>load(true);load(false);setInterval(()=>load(false),30*60*1000);
</script></body></html>
